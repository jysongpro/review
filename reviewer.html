<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>검토위원 - 교육운영계획서 검토 지원도구</title>
<link rel="stylesheet" href="css/style.css?v=1.11.0">
<style>
  .modal-overlay{
    display:none; position:fixed; inset:0; z-index:1000;
    background:rgba(10,20,40,.55);
    align-items:flex-start; justify-content:center;
    padding:30px 16px; overflow-y:auto;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:#fff; border-radius:14px; max-width:1000px; width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
    max-height:calc(100vh - 60px); overflow-y:auto;
  }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 24px; border-bottom:1px solid #dde5f0;
    position:sticky; top:0; background:#fff; border-radius:14px 14px 0 0; z-index:2;
  }
  .modal-head h2{margin:0;font-size:17px;color:#0f2c5c;}
  .modal-close{
    border:none;background:#eef2f8;color:#334;
    width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;
  }
  .modal-body{padding:20px 24px 26px;}
  .info-table{width:100%;border-collapse:collapse;margin-bottom:16px;}
  .info-table th,.info-table td{border:1px solid #dde5f0;padding:9px 10px;font-size:13px;text-align:center;}
  .info-table th{background:#e6effa;color:#0f2c5c;font-weight:700;white-space:nowrap;}
</style>
</head>
<body>
<header class="topbar">
  <h1>검토위원</h1>
  <button class="admin-btn" onclick="location.href='index.html'">메인으로</button>
</header>

<div id="loginView" class="login-box">
  <h2>검토위원 로그인</h2>
  <p style="font-size:16px;color:#6b7785;margin-top:-6px;">
    관리자가 사전에 등록한 휴대폰 번호로 로그인합니다.
  </p>
  <div class="field">
    <label>휴대폰 번호</label>
    <input id="phoneInput" placeholder="010-0000-0000" inputmode="numeric">
  </div>
  <button class="btn" id="loginBtn" style="width:100%;">로그인</button>
  <div id="loginMsg" class="msg"></div>
</div>

<div id="mainView" class="container" style="display:none;">
  <div class="card">
    <h2>검토위원 정보</h2>
    <p id="reviewerInfo"></p>
    <button class="btn secondary small" id="logoutBtn">로그아웃</button>
  </div>

  <div class="card">
    <h2>배정된 교육운영계획서 검토 목록</h2>
    <table id="assignedTable">
      <thead><tr><th>과정</th><th>대학</th><th>캠퍼스</th><th>학과</th><th>전공</th><th>계열</th><th>진행상태</th><th>검토하기</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- 교육운영계획서 검토하기: 별도 창(모달)으로 표시 -->
<div class="modal-overlay" id="reviewModal">
  <div class="modal-box">
    <div class="modal-head">
      <h2>교육운영계획서 검토 하기</h2>
      <button class="modal-close" id="modalCloseBtn">✕</button>
    </div>
    <div class="modal-body">
      <table class="info-table" id="reviewInfoTable"></table>

      <p>
        <a id="pdfViewLink" href="#" target="_blank" class="btn secondary small">운영계획서 PDF 보기</a>
        <a id="pdfDownloadLink" href="#" download class="btn small">운영계획서 PDF 다운로드</a>
        <span id="pdfNone" style="display:none;color:#999;font-size:13px;">업로드된 PDF가 없습니다.</span>
      </p>
      <p id="submittedNotice" style="display:none;color:#c62828;font-weight:700;font-size:13px;margin:10px 0 0;">
        ✔ 최종 제출이 완료되어 더 이상 수정할 수 없습니다.
      </p>

      <h3 style="font-size:15px;color:#0f2c5c;margin:18px 0 8px;">1. 교과과정개편 세부기준 준수 여부</h3>
      <table id="reviewItemsTablePart1">
        <colgroup>
          <col style="width:60px;">
          <col style="width:40%;">
          <col style="width:12%;">
          <col style="width:40%;">
        </colgroup>
        <thead><tr><th>순번</th><th>검토문항</th><th>검토결과</th><th>검토의견</th></tr></thead>
        <tbody></tbody>
      </table>

      <h3 style="font-size:15px;color:#0f2c5c;margin:22px 0 8px;">2. 교육운영계획서 세부내용 검토</h3>
      <table id="reviewItemsTablePart2">
        <colgroup>
          <col style="width:60px;">
          <col style="width:40%;">
          <col style="width:12%;">
          <col style="width:40%;">
        </colgroup>
        <thead><tr><th>순번</th><th>검토문항</th><th>검토결과</th><th>검토의견</th></tr></thead>
        <tbody></tbody>
      </table>

      <div id="reviewActionBtns" style="margin-top:14px;">
        <button class="btn" id="saveReviewBtn">저장</button>
      </div>
      <span id="saveMsg" class="msg"></span>
    </div>
  </div>
</div>

<script type="module" src="js/reviewer.js?v=1.11.0"></script>
</body>
</html>
