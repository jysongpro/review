<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>검토결과조회 - 교육운영계획서 검토 지원도구</title>
<link rel="stylesheet" href="css/style.css?v=1.7.1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<header class="topbar">
  <h1>검토결과조회</h1>
  <button class="admin-btn" onclick="location.href='index.html'">메인으로</button>
</header>

<div class="container">
  <div class="card">
    <h2>조회 조건</h2>
    <div class="row">
      <div class="field"><label>과정구분</label><select id="courseSel"></select></div>
      <div class="field"><label>캠퍼스</label><input id="campusSel" placeholder="전체"></div>
      <div class="field"><label>학과</label><input id="deptSel" placeholder="전체"></div>
      <div class="field"><label>전공과정</label><input id="majorSel" placeholder="전체"></div>
    </div>
    <button class="btn" id="searchBtn">조회</button>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <h2>조회 결과</h2>
    <div class="row" style="justify-content:flex-end;">
      <button class="btn secondary small" id="exportBtn">엑셀 저장</button>
      <button class="btn secondary small" id="printBtn">출력(인쇄)</button>
    </div>
    <table id="resultTable">
      <thead><tr><th>과정구분</th><th>캠퍼스</th><th>학과</th><th>전공과정</th><th>검토위원</th><th>검토분야</th><th>검토문항</th><th>결과</th><th>검토의견</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script type="module" src="js/result.js?v=1.7.1"></script>
</body>
</html>
