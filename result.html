<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>검토결과조회 - 교육운영계획서 검토 지원도구</title>
<link rel="stylesheet" href="css/style.css?v=1.19.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  .modal-overlay{ display:none; position:fixed; inset:0; z-index:1000; background:rgba(10,20,40,.55);
    align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto; }
  .modal-overlay.open{ display:flex; }
  .modal-box{ background:#fff; border-radius:14px; max-width:1000px; width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.35); max-height:calc(100vh - 60px); overflow-y:auto; }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 24px;
    border-bottom:1px solid #dde5f0; position:sticky; top:0; background:#fff; border-radius:14px 14px 0 0; }
  .modal-head h2{ margin:0; font-size:17px; color:#0f2c5c; }
  .modal-close{ border:none; background:#eef2f8; color:#334; width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:16px; }
  .modal-body{ padding:20px 24px 26px; }
  .info-table{ width:100%; border-collapse:collapse; margin-bottom:16px; }
  .info-table th, .info-table td{ border:1px solid #dde5f0; padding:8px; }
  .info-table th{ background:#e6effa; color:#0f2c5c; }
  .info-table td{ text-align:center; }
  @media print{
    body > *{ display:none !important; }
    #opinionModal{ display:block !important; position:static !important; background:none !important; padding:0 !important; }
    #opinionModal .modal-box{ box-shadow:none !important; max-height:none !important; max-width:none !important; }
    #opinionModal .modal-body{ padding:0 24px !important; }
    .no-print{ display:none !important; }
  }
</style>
</head>
<body>
<header class="topbar">
  <h1>검토결과조회</h1>
  <button class="admin-btn" onclick="location.href='index.html'">메인으로</button>
</header>

<div class="container">
  <div class="card">
    <h2>조회 조건</h2>
    <div class="row">
      <div class="field"><label>과정</label><select id="courseSel"><option value="">불러오는 중...</option></select></div>
      <div class="field"><label>대학</label><select id="univSel"><option value="">불러오는 중...</option></select></div>
      <div class="field"><label>캠퍼스</label><select id="campusSel"><option value="">불러오는 중...</option></select></div>
      <div class="field"><label>학과</label><select id="deptSel"><option value="">불러오는 중...</option></select></div>
    </div>
    <button class="btn" id="searchBtn">조회</button>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <h2>조회 결과</h2>
    <div class="row" style="justify-content:flex-end;">
      <button class="btn secondary small" id="exportBtn">엑셀 저장</button>
      <button class="btn secondary small" id="printBtn">출력(인쇄)</button>
    </div>
    <table id="resultTable">
      <thead><tr><th>대학</th><th>캠퍼스</th><th>학과</th><th>전공</th><th>계열</th><th>검토위원</th><th>최종결과</th><th>검토의견서보기</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- 검토의견서 보기 모달 -->
<div class="modal-overlay" id="opinionModal">
  <div class="modal-box">
    <div class="modal-head">
      <h2>검토의견서 보기</h2>
      <div class="no-print" style="display:flex;gap:8px;">
        <button class="btn secondary small" id="opinionPrintBtn">인쇄하기</button>
        <button class="modal-close" id="opinionModalClose">✕</button>
      </div>
    </div>
    <div class="modal-body">
      <h3 style="font-size:15px;color:#0f2c5c;margin:0 0 8px;">2027학년도 교육운영계획서 정보</h3>
      <table class="info-table" id="opinionTargetInfoTable"></table>

      <h3 style="font-size:15px;color:#0f2c5c;margin:0 0 8px;">검토위원 정보</h3>
      <table class="info-table" id="opinionReviewerInfoTable"></table>

      <h3 style="font-size:15px;color:#0f2c5c;margin:0 0 8px;">최종결과</h3>
      <table class="info-table" id="opinionFinalTable"></table>

      <h3 style="font-size:14px;color:#0f2c5c;margin:14px 0 8px;">1. 교과과정개편 세부기준 준수 여부</h3>
      <table id="opinionTablePart1"><thead><tr><th style="width:60px;">순번</th><th>검토문항</th><th style="width:80px;">결과</th><th>검토의견</th></tr></thead><tbody></tbody></table>

      <h3 style="font-size:14px;color:#0f2c5c;margin:18px 0 8px;">2. 교육운영계획서 세부내용 검토</h3>
      <table id="opinionTablePart2"><thead><tr><th style="width:60px;">순번</th><th>검토문항</th><th style="width:80px;">결과</th><th>검토의견</th></tr></thead><tbody></tbody></table>
    </div>
  </div>
</div>

<script type="module" src="js/result.js?v=1.19.0"></script>
</body>
</html>
